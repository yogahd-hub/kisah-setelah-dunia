name: Render anime (HyperFrames)

on:
  workflow_dispatch:
    inputs:
      folder:
        description: "Folder komposisi di dalam anime/ (contoh: uji-anime)"
        required: true
        default: "uji-anime"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install FFmpeg + font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fontconfig > /dev/null
          mkdir -p ~/.local/share/fonts && cp fonts/*.ttf ~/.local/share/fonts/ && fc-cache -f > /dev/null
          node -v && ffmpeg -version | head -1

      - name: Siapkan proyek HyperFrames
        run: |
          mkdir -p hfwork && cd hfwork
          npx --yes hyperframes@latest --version || true
          npx --yes hyperframes@latest init proj 2>&1 | tail -20 || true
          if [ ! -d proj ]; then mkdir proj; fi
          cp -r ../anime/${{ github.event.inputs.folder }}/. proj/
          echo "--- isi proyek ---"; ls -la proj
          cd proj && (npx --yes hyperframes@latest doctor 2>&1 | tail -30 || true)

      - name: Render
        run: |
          cd hfwork/proj
          npx --yes hyperframes@latest render 2>&1 | tee render.log
          echo "--- file video ---"; find . -name "*.mp4" -not -path "*/node_modules/*" | tee mp4list.txt
          test -s mp4list.txt

      - name: Kumpulkan hasil
        if: always()
        run: |
          mkdir -p out
          find hfwork/proj -name "*.mp4" -not -path "*/node_modules/*" -exec cp {} out/ \; || true
          cp hfwork/proj/render.log out/ 2>/dev/null || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: anime-${{ github.event.inputs.folder }}-${{ github.run_number }}
          path: out/
          retention-days: 30
