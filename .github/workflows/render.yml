name: Render video

on:
  push:
    paths: ["scripts/**.json", "suara/**"]
  workflow_dispatch:
    inputs:
      scripts:
        description: "Naskah yang dirender, pisahkan spasi (contoh: scripts/s1-ep01.json). Kosongkan = semua naskah yang belum pernah dirender."
        required: false
        default: ""

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pilih naskah
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.scripts }}" ]; then
            LIST="${{ github.event.inputs.scripts }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            LIST=$(git diff --name-only --diff-filter=AM ${{ github.event.before }} ${{ github.sha }} -- 'scripts/*.json' | tr '\n' ' ')
            # suara manual baru di suara/<nama>.* -> render naskah scripts/<nama>.json
            for a in $(git diff --name-only --diff-filter=AM ${{ github.event.before }} ${{ github.sha }} -- 'suara/*'); do
              n=$(basename "$a"); n="${n%.*}"
              if [ -f "scripts/$n.json" ] && ! echo " $LIST " | grep -q " scripts/$n.json "; then LIST="$LIST scripts/$n.json"; fi
            done
          else
            LIST=""
            for f in scripts/*.json; do
              n=$(basename "$f" .json); [ -f "done/$n.txt" ] || LIST="$LIST $f"
            done
          fi
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
          echo "Naskah: $LIST"

      - name: Cek API key
        id: key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY belum diisi. Render tetap jalan memakai suara manual (folder suara/) atau Edge TTS (\"tts\": \"edge\" di naskah)."
            echo "ok=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ok=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.pick.outputs.list != '' && steps.key.outputs.ok == 'yes'
        with:
          node-version: 22

      - name: Cache model whisper
        if: steps.pick.outputs.list != '' && steps.key.outputs.ok == 'yes'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Install
        if: steps.pick.outputs.list != '' && steps.key.outputs.ok == 'yes'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libraqm0 libfribidi0 > /dev/null
          pip install -q pillow numpy faster-whisper edge-tts
          mkdir -p ~/.local/share/fonts && cp fonts/*.ttf ~/.local/share/fonts/ && fc-cache -f > /dev/null
          python -c "from PIL import features; assert features.check('raqm'), 'raqm (teks Arab) tidak aktif'; print('raqm ok')"

      - name: Periksa naskah
        if: steps.pick.outputs.list != ''
        run: python3 engine/check.py ${{ steps.pick.outputs.list }}

      - name: Render
        if: steps.pick.outputs.list != '' && steps.key.outputs.ok == 'yes'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TTS_CADANGAN: ${{ vars.TTS_CADANGAN }}
        run: |
          mkdir -p done
          for f in ${{ steps.pick.outputs.list }}; do
            echo "::group::$f"
            python engine/reel.py "$f"
            n=$(basename "$f" .json)
            date -u +"%Y-%m-%dT%H:%MZ" > "done/$n.txt"
            echo "::endgroup::"
          done

      - name: Cek ukuran 9:16 (1080x1920)
        if: steps.pick.outputs.list != '' && steps.key.outputs.ok == 'yes'
        run: |
          bad=0
          for f in out/*/*.mp4 out/*/cover.jpg; do
            [ -f "$f" ] || continue
            s=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$f")
            echo "$f -> $s"
            [ "$s" = "1080,1920" ] || { echo "::error::$f bukan 9:16 1080x1920 (ukuran $s)"; bad=1; }
          done
          exit $bad

      - name: Upload hasil
        if: steps.pick.outputs.list != '' && steps.key.outputs.ok == 'yes'
        uses: actions/upload-artifact@v5
        with:
          name: video-${{ github.run_number }}
          path: out/
          retention-days: 30

      - name: Simpan permanen di Releases (unduh langsung, tanpa zip)
        if: steps.pick.outputs.list != '' && steps.key.outputs.ok == 'yes' && github.event.repository.visibility == 'public'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p rel
          for d in out/*/; do
            n=$(basename "$d")
            for f in "$d"*.mp4; do [ -f "$f" ] && cp "$f" "rel/$n.mp4"; done
            [ -f "$d/cover.jpg" ] && cp "$d/cover.jpg" "rel/$n - cover.jpg"
            [ -f "$d/caption.txt" ] && cp "$d/caption.txt" "rel/$n - caption.txt"
          done
          ls rel
          gh release create "video-${{ github.run_number }}" rel/* \
            --title "Video render #${{ github.run_number }}" \
            --notes "Naskah: ${{ steps.pick.outputs.list }}" || echo "::warning::Gagal membuat Release; video tetap ada di Artifacts."

      - name: Tandai selesai
        if: steps.pick.outputs.list != '' && steps.key.outputs.ok == 'yes'
        run: |
          git config user.name "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          git add done/
          git commit -m "Selesai render: ${{ steps.pick.outputs.list }}" || exit 0
          git pull --rebase -q && git push -q
